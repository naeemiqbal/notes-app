name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION:       us-east-1
  ECR_REPOSITORY:   notes-app
  EB_APP_NAME:      notes-app
  EB_ENV_NAME:      notes-app-env
  EB_S3_BUCKET:     elasticbeanstalk-us-east-1-039859352486

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Test — backend unit tests + frontend lint
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: mvn test -q

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job 2: Build — Docker image → push to ECR
  # Runs only on push to main (not PRs)
  # ─────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          TAG="${{ steps.meta.outputs.tag }}"

          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

          echo "Pushed $IMAGE:$TAG"

  # ─────────────────────────────────────────────
  # Job 3: Deploy — new EB app version → update environment
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Create deployment bundle
        run: zip -j deploy.zip Dockerrun.aws.json

      - name: Upload bundle to S3
        run: |
          VERSION_LABEL="deploy-${{ github.sha }}"
          aws s3 cp deploy.zip \
            "s3://$EB_S3_BUCKET/$EB_APP_NAME/${VERSION_LABEL}.zip"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> "$GITHUB_ENV"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label    "$VERSION_LABEL" \
            --source-bundle    "S3Bucket=$EB_S3_BUCKET,S3Key=$EB_APP_NAME/${VERSION_LABEL}.zip" \
            --region           "$AWS_REGION"

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name  "$EB_APP_NAME" \
            --environment-name  "$EB_ENV_NAME" \
            --version-label     "$VERSION_LABEL" \
            --region            "$AWS_REGION"

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for environment to become Ready..."
          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APP_NAME" \
            --environment-name "$EB_ENV_NAME" \
            --region           "$AWS_REGION"

      - name: Print live URL
        run: |
          URL=$(aws elasticbeanstalk describe-environments \
            --application-name "$EB_APP_NAME" \
            --environment-names "$EB_ENV_NAME" \
            --query 'Environments[0].CNAME' \
            --output text --region "$AWS_REGION")
          echo ""
          echo "✅ Deployed to: http://${URL}"
          echo ""
