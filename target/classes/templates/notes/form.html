<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${noteForm.id == null} ? 'New Note' : 'Edit Note'">Note Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-journal-plus me-2" th:if="${noteForm.id == null}"></i>
                        <i class="bi bi-journal-check me-2" th:unless="${noteForm.id == null}"></i>
                        <span th:text="${noteForm.id == null} ? 'Create Note' : 'Edit Note'">Note Form</span>
                    </h4>
                </div>
                <div class="card-body">

                    <form th:action="${noteForm.id == null} ? @{/notes/new} : @{/notes/edit/{id}(id=${noteForm.id})}"
                          th:object="${noteForm}" method="post" novalidate>

                        <!-- Note text -->
                        <div class="mb-3">
                            <label for="noteText" class="form-label fw-semibold">
                                Note <span class="text-danger">*</span>
                            </label>
                            <textarea id="noteText" th:field="*{note}" rows="4"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('note')} ? ' is-invalid'"
                                      placeholder="Write your note here..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label for="created" class="form-label fw-semibold">Date</label>
                            <input type="date" id="created" th:field="*{created}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('created')} ? ' is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('created')}" th:errors="*{created}"></div>
                            <div class="form-text" th:if="${noteForm.id == null}">Leave blank to use today's date.</div>
                        </div>

                        <!-- Active toggle -->
                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}"/>
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${noteForm.id == null} ? 'Save' : 'Update'">Save</span>
                            </button>
                            <a th:href="@{/notes}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
