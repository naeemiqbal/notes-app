<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Notes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"><i class="bi bi-journal-text me-2"></i>Notes</h2>
        <a th:href="@{/notes/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Note
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Notes table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Note</th>
                        <th>Created</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(notes)}">
                        <td colspan="5" class="text-center text-muted py-4">No notes found. Create one!</td>
                    </tr>
                    <tr th:each="note : ${notes}">
                        <td th:text="${note.id}" class="align-middle text-muted"></td>
                        <td th:text="${note.note}" class="align-middle"></td>
                        <td th:text="${#temporals.format(note.created, 'dd MMM yyyy')}" class="align-middle"></td>
                        <td class="align-middle">
                            <span th:if="${note.active}" class="badge bg-success">Active</span>
                            <span th:unless="${note.active}" class="badge bg-secondary">Inactive</span>
                        </td>
                        <td class="text-center align-middle">
                            <a th:href="@{/notes/edit/{id}(id=${note.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <form th:action="@{/notes/delete/{id}(id=${note.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this note?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
